[project]
name = "netkeeper"
version = "0.0.1"
description = "Keep your professional network warm: LinkedIn contact extractor, local CRM, and reconnect sequences over Gmail and LinkedIn."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "David Morgan" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = [
  "fastapi>=0.121",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "typer>=0.12",
  "sse-starlette>=2.1",
  "keyring>=25",
  "regex>=2026.9.10",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "psycopg[binary]>=3.2",
  "towncrier>=24.8",
  "types-regex>=2026.9.10.20260911",
]

[project.scripts]
netkeeper = "netkeeper.cli:app"

[project.urls]
Homepage = "https://github.com/dsmorgan/netkeeper"
Issues = "https://github.com/dsmorgan/netkeeper/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netkeeper"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "ASYNC", "S", "T20", "PTH", "ERA"]
ignore = ["ANN401", "S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "PTH", "T20"]
"scripts/**" = ["T20", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["netkeeper", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["keyring.*", "sse_starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:netkeeper.*"]

[tool.towncrier]
package = "netkeeper"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/dsmorgan/netkeeper/issues/{issue})"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true
