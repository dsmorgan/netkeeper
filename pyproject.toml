[project]
name = "netkeeper"
version = "0.0.1"
description = "Keep your professional network warm: LinkedIn contact extractor, local CRM, and reconnect sequences over Gmail and LinkedIn."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "David Morgan" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = [
  "fastapi>=0.121",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.1",
  "alembic>=1.13",
  "pydantic>=2.7",
  "typer>=0.12",
  # Attach-only browser driver: connect_over_cdp needs no bundled browser, so
  # `playwright install` is never part of the setup (ADR 0002, spec 6).
  "playwright>=1.55",
  "sse-starlette>=2.1",
  "keyring>=25",
  "regex>=2026.9.10",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10,<4",
  # Template rendering (spec 11.1): always through the sandboxed environment.
  "jinja2>=3.1",
  # The Gmail API client (spec 6, 11.5; P3-02). Discovery is the bundled static
  # document, so building the service never fetches one.
  "google-api-python-client>=2.150",
  # Imported directly by netkeeper/campaigns/gmail.py, not only through the
  # client above. The transport that never resends a write (WriteOnceHttp)
  # subclasses httplib2's; tests/test_gmail_transport.py pins the resend it undoes.
  "google-auth>=2.30",
  "google-auth-httplib2>=0.2",
  "httplib2>=0.22",
  # A recipient domain written in Unicode goes into To as IDNA 2008 (#280). Already
  # installed through anyio and requests; imported directly by netkeeper/campaigns/compose.py.
  "idna>=3.7",
  # Reads the old mailing tool's workbook for the history import (#65). Read-only,
  # data_only: a formula's cached value, never one evaluated.
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "psycopg[binary]>=3.2",
  "towncrier>=24.8",
  "types-regex>=2026.9.10.20260911",
  "pytest-xdist>=3.6",
  "types-openpyxl>=3.1",
]

[project.scripts]
netkeeper = "netkeeper.cli:app"

[project.urls]
Homepage = "https://github.com/dsmorgan/netkeeper"
Issues = "https://github.com/dsmorgan/netkeeper/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netkeeper"]

[tool.uv]
# Always a uv-managed CPython, never the host's own: CI's `uv python install` gets
# the newest 3.12 patch, while a container's system python3.12 can be an older one
# that behaves differently (#231). uv downloads the interpreter on first sync.
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "ASYNC", "S", "T20", "PTH", "ERA"]
ignore = ["ANN401", "S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "PTH", "T20"]
"scripts/**" = ["T20", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["netkeeper", "tests", "scripts"]

[[tool.mypy.overrides]]
module = [
  "keyring.*",
  "sse_starlette.*",
  "apscheduler.*",
  "googleapiclient.*",
  "google_auth_httplib2",
  "httplib2",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:netkeeper.*"]
markers = [
  "slow: seconds of CPU on purpose (the week simulations); skipped by `make test-fast`, and given tests/time_limit.py's longer limit",
  "real_cdp: may attach to a real, isolated Chrome over CDP (the opt-in smoke suite); port 9222 stays blocked even then (tests/conftest.py)",
]

[tool.towncrier]
package = "netkeeper"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/dsmorgan/netkeeper/issues/{issue})"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true
