# Routine version updates, weekly. Each ecosystem's minor and patch bumps come
# as one grouped pull request; a major bump comes on its own, so it can be read
# separately. Security updates are enabled in the repository settings and don't
# depend on this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # frontend/package.json and pnpm-lock.yaml (the npm ecosystem reads pnpm lockfiles).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the Node runtime's major (ci.yml setup-node). Bump both
      # together on purpose when the runtime moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
